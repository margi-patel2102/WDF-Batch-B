<!DOCTYPE html>
<html>

<head>
    <title>StudentHub - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            Student<span>Hub</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <!-- MAIN -->
    <main>

        <div class="signup-box">

            <h1>Create <span>Account</span></h1>

            <p class="description">
                Create your StudentHub account to access
                your academic information.
            </p>


            <!-- SIGNUP FORM -->
            <form id="signupForm">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                >

                <small id="nameError"></small>


                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <small id="emailError"></small>


                <label for="studentId">Student ID</label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter your student ID"
                >

                <small id="studentIdError"></small>


                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create a username"
                >

                <small id="usernameError"></small>


                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10 digit mobile number"
                >

                <small id="mobileError"></small>


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                >

                <div id="passwordStrength"></div>

                <small id="passwordError"></small>


                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                >

                <small id="confirmPasswordError"></small>


                <label for="course">Course</label>

                <select id="course" name="course">

                    <option value="">Select Course</option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="CSE">
                        Computer Science
                    </option>

                    <option value="CE">
                        Computer Engineering
                    </option>

                </select>

                <small id="courseError"></small>


                <label for="year">Year</label>

                <select id="year" name="year">

                    <option value="">Select Year</option>

                    <option value="1">1st Year</option>

                    <option value="2">2nd Year</option>

                    <option value="3">3rd Year</option>

                    <option value="4">4th Year</option>

                </select>

                <small id="yearError"></small>


                <!-- GENDER -->

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <small id="genderError"></small>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            value="accepted"
                        >

                        I accept the Terms & Conditions

                    </label>

                </div>

                <small id="termsError"></small>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="create-button"
                    id="createButton"
                >
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        © 2026 StudentHub Portal
    </footer>


    <!-- SUCCESS MODAL -->

    <div
        class="modal-overlay"
        id="successModal"
    >

        <div class="success-modal">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Account Created!
            </h2>

            <p>
                Your StudentHub account has been
                created successfully.
            </p>

            <button
                id="continueButton"
                class="continue-button"
            >
                Continue to Login
            </button>

        </div>

    </div>


</body>
</html>
